version: 2 

sources:
  - name: raw_data  #logical source
    schema: SF_SCHEMA  #schema 1
    database: SNOWFLAKE_DBT_DATA # 1 database 
    tables: # n no of tables 
      - name: Cust   #logical name
        identifier: CUSTOMERS  # actual table
      - name : sales
        identifier: SALES_DATA
      - name : ord
        identifier: orders
      - name : scd_table
        identifier: SUPPLY_CHAIN_ORDERS
      - name : tel_cust
        identifier: TELECOM_CUSTOMERS
      - name : tel_phone
        identifier: TELECOM_PLANS
      - name : tele_cust
        identifier: TELECOM_CUSTOMERS
        loaded_at_field : "convert_timezone('UTC', registered_on)"
        freshness:
          error_after: {count : 1, period : hour}
  - name : prod_data  # 2nd logical bame 
    schema: PROD_SCH
    database: SNOWFLAKE_DBT_DATA
    tables:
      - name: prod
        identifier: PRODUCT  #
