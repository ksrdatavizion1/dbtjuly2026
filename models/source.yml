version: 2 

sources:
  - name: raw_data  #logical source
    schema: SF_SCHEMA  #schema 1
    database: SNOWFLAKE_DBT_DATA # 1 database 
    tables: # n no of tables 
      - name: Cust   #logical name
        identifier: CUSTOMERS  # actual table
      - name : sales
        identifier: SALES_DATA
      - name : ord
        identifier: orders
      - name : scd_table
        identifier: SUPPLY_CHAIN_ORDERS
      - name : tel_cust
        identifier: TELECOM_CUSTOMERS
        columns:
          - name: CUSTOMER_ID
            tests:
              - not_null
              - unique
          - name: EMAIL
            tests:
              - unique
              - valid_email_format
          - name: GENDER
            tests:
              - accepted_values:
                  arguments: 
                  values: ['Male','Female']
          - name : AGE 
            tests:
              - value_range:
                  config: 
                    severity: warn
                  min_val : 18
                  max_val: 30   

      - name : tel_phone
        identifier: TELECOM_PLANS
        columns:
          - name: CUSTOMER_ID
            tests:
              - not_null:
                  config: 
                    severity: warn
              - relationships:
                  config: 
                    severity: warn
                  arguments:
                  to: source('raw_data', 'tel_cust')
                  field: CUSTOMER_ID
              
        
  - name : prod_data  # 2nd logical bame 
    schema: PROD_SCH
    database: SNOWFLAKE_DBT_DATA
    tables:
      - name: prod
        identifier: PRODUCT  #
  - name : sales
    schema : PUBLIC
    database: DBT_LABS
    tables:
      - name: sale
        identifier: SALES_ORDERS
